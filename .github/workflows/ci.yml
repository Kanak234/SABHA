name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run verification test suite
        run: |
          python3 tools/sab_jaancho.py

      # दर्पण असली tkinter की खिड़की बनाता है. runner पर display नहीं होता,
      # इसलिए xvfb के नीचे चलता है. display न मिले तो यह जाँच चुपचाप पास
      # नहीं होती -- वो साफ़ कहती है कि चली ही नहीं.
      - name: Run the GUI test suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python3 tools/darpan_jaancho.py
